name: Discord Repository Notifications

on:
  workflow_dispatch: {}

  push:
    branches:
      - contents # Adjust to your default branch (e.g., 'main' or 'master')
  pull_request:
    types: [opened, reopened, closed, edited]
    branches:
      - contents
  issues:
    types: [opened, edited, closed]

  issue_comment:
    types: [created, edited, deleted]

  release:
    types: [published]

jobs:
  notify-discord:
    name: Send Discord Notification
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord (Push Event)
        if: github.event_name == 'push'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: |
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            **NIOS UNOFFICIAL — Repository Update**
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            **Repository:** ${{ github.repository }}
            **Event:** Push
            **Branch:** ${{ github.ref_name || github.ref }}

            **Commit Author:**  
            • Name: ${{ github.event.head_commit && github.event.head_commit.author && github.event.head_commit.author.name || github.actor }}
            • Username: ${{ github.actor }}
            • Email: ${{ github.event.head_commit && github.event.head_commit.author && github.event.head_commit.author.email || 'Not Provided' }}

            **Commit Details:**  
            • Message: ${{ github.event.head_commit && github.event.head_commit.message || 'No commit message' }}
            • Commit SHA: ${{ github.sha }}
            • Commit URL: ${{ github.event.head_commit && github.event.head_commit.url || '' }}

            **Workflow Info:**  
            • Workflow: ${{ github.workflow }}
            • Run ID: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Timestamp:** ${{ github.event.head_commit && github.event.head_commit.timestamp || github.event.repository && github.event.repository.pushed_at || 'N/A' }}
            **Total Commits:** `${{ github.event.commits && github.event.commits.length || 1 }}`

            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            _Automated notification sent via GitHub Actions_
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Notify Discord (Other Events)
        if: github.event_name != 'push'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: |
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            **Repository Activity Alert**
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            **Repository:** ${{ github.repository }}
            **Event Type:** ${{ github.event_name }}
            **Action:** ${{ github.event.action || 'N/A' }}
            **Branch / Ref:** ${{ github.ref_name || github.ref || 'N/A' }}

            **Triggered By:** ${{ github.actor }}

            **Reference Links:**  
            ${{ github.event.pull_request && format('• Pull Request: {0}', github.event.pull_request.html_url) || '' }}
            ${{ github.event.issue && format('• Issue: {0}', github.event.issue.html_url) || '' }}
            ${{ github.event.release && format('• Release: {0}', github.event.release.html_url) || '' }}

            **Workflow Info:**  
            • Workflow: ${{ github.workflow }}
            • Run ID: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Timestamp:** ${{ github.event.created_at || (github.event.pull_request && github.event.pull_request.created_at) || (github.event.issue && github.event.issue.created_at) || 'N/A' }}
            **Total Commits:** `${{ github.event.commits && github.event.commits.length || 1 }}`

            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            _This message was automatically generated_
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
